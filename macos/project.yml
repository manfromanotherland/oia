name: Oia
configs:
  Debug: debug
  Release: release
  Profile: release
options:
  bundleIdPrefix: is.edmundo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown.git
    exactVersion: "0.8.0"
  LazyLayoutKit:
    path: Packages/LazyLayoutKit
  # Sparkle drives in-app software updates (the "Check for Updates…" menu item and,
  # once the user opts in, periodic background checks). Distributed as a binary
  # XCFramework over SPM, so Xcode embeds and signs Sparkle.framework into the app
  # automatically — no manual "Embed Frameworks" phase needed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

targets:
  Oia:
    type: application
    platform: macOS
    sources:
      - Sources/Oia
      - path: Resources/instagram-download.py
        buildPhase: resources
      - path: GeneratedBindings
        optional: true   # populated by `make bindings`
    dependencies:
      - framework: Frameworks/OiaCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreImage.framework
      - sdk: CoreSpotlight.framework
      - sdk: ImageIO.framework
      - sdk: Vision.framework
      - package: LazyLayoutKit
      - package: Markdown
      - package: Sparkle
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: is.edmundo.cuttings
        PRODUCT_NAME: Óia
        PRODUCT_MODULE_NAME: Oia
        EXECUTABLE_NAME: Oia
        ASSETCATALOG_COMPILER_APPICON_NAME: Oia
        INFOPLIST_FILE: Sources/Oia/App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/GeneratedBindings
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/GeneratedBindings/oia_coreFFI.modulemap
      configs:
        # An ad-hoc signed profiling app must load Sparkle's bundled framework.
        # Keep hardened runtime on for the shippable Release configuration.
        Profile:
          ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: Sources/Oia/App/Oia.entitlements
    preBuildScripts:
      - name: Build and copy oia-native-host
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Xcode runs build phases with a sanitized PATH that omits ~/.cargo/bin,
          # so make cargo discoverable before invoking it.
          if [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:$PATH"
          CORE="${SRCROOT}/../core"
          cargo build --release --manifest-path "${CORE}/Cargo.toml" --bin oia-native-host
          SRC="${CORE}/target/release/oia-native-host"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/oia-native-host"
          cp "${SRC}" "${DST}"
          chmod +x "${DST}"
        inputFiles:
          - $(SRCROOT)/../core/native-host/src/main.rs
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/oia-native-host

  # Fast unit tests for app logic and the in-process virtualized board host:
  # library-scope membership,
  # content-length formatting, and the FFI-to-presentation ReadingRow mapper. It
  # compiles the specific files under test directly — the same way
  # OiaUITests shares AccessibilityID.swift — rather than hosting in the
  # app. The board performance regression uses an isolated test
  # window; the suite never launches Oia or touches the dev's real library
  # or defaults. The generated bindings and the static core
  # framework are linked because the code under test still meets the FFI
  # boundary: the mapper takes an `FfiReadingRow` and `LibraryScope.ffiView`
  # returns an `FfiView`.
  OiaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OiaTests
      - path: Sources/Oia/State/SidebarItem.swift
      - path: Sources/Oia/State/SidebarCounts.swift
      - path: Sources/Oia/State/ComposedFilter.swift
      - path: Sources/Oia/State/BoardSelection.swift
      - path: Sources/Oia/State/BoardSearch.swift
      - path: Sources/Oia/Platform/Library/LibraryBookmark.swift
      - path: Sources/Oia/State/ReadingSort.swift
      - path: Sources/Oia/App/Shortcuts.swift
      - path: Sources/Oia/App/TestHooks.swift
      - path: Sources/Oia/App/PerformanceTrace.swift
      - path: Sources/Oia/Bridge/ReadingQuery.swift
      - path: Sources/Oia/Shared/Formatting/ReadingTime.swift
      - path: Sources/Oia/Shared/Formatting/ReadingDateTime.swift
      - path: Sources/Oia/Features/Tags/TagRules.swift
      # Reader typography: the preference vocabulary and the theme that derives
      # every measure/leading value from it. Pure value types, no FFI.
      - path: Sources/Oia/Shared/Preferences/TypographySettings.swift
      - path: Sources/Oia/Shared/Preferences/CardSize.swift
      - path: Sources/Oia/Features/Reader/Markdown/MarkdownTheme.swift
      - path: Sources/Oia/Bridge/Mappers/ReadingRow.swift
      - path: Sources/Oia/Bridge/Mappers/ReadingSourceProfile.swift
      - path: Sources/Oia/Features/Oia/OiaTheme.swift
      - path: Sources/Oia/Features/Oia/OiaCardTextMetrics.swift
      - path: Sources/Oia/Features/Oia/FullArticleCardText.swift
      - path: Sources/Oia/Resources/Newsreader-VariableFont_opsz-wght.ttf
        buildPhase: resources
      - path: Sources/Oia/Features/Oia/ReadingRow+MediaGeometry.swift
      - path: Sources/Oia/Features/Oia/AssetPreviewPipeline.swift
      - path: Sources/Oia/Features/Oia/LocalReadingImage.swift
      - path: Sources/Oia/Features/Oia/LocalReadingFavicon.swift
      - path: Sources/Oia/Features/Oia/ReadingQuickLookURLResolver.swift
      - path: Sources/Oia/Features/Oia/ReadingClipboard.swift
      - path: Sources/Oia/Features/Oia/LazyMasonryBoard.swift
      - path: Sources/Oia/Features/Oia/BoardVisibilityCoordinator.swift
      - path: Sources/Oia/Features/Oia/ReadingRow+BoardGeometry.swift
      - path: Sources/Oia/Features/Oia/GallerySnapshot.swift
      - path: Sources/Oia/Features/Oia/VideoCardViewport.swift
      - path: Sources/Oia/Features/Oia/VideoPlaybackScheduler.swift
      - path: Sources/Oia/Features/Reader/Markdown/AssetImageLoader.swift
      - path: Sources/Oia/Features/Reader/Markdown/AnimatedLocalGIF.swift
      - path: Sources/Oia/Features/Reader/Markdown/AssetPreviewDecodeQueue.swift
      - path: Sources/Oia/Features/Reader/Markdown/AssetPreviewDecodeKey.swift
      - path: Sources/Oia/Features/Reader/Markdown/AssetPreviewDiskCache.swift
      - path: Sources/Oia/Features/Reader/Markdown/AssetPreviewImageCache.swift
      - path: Sources/Oia/Features/Reader/Markdown/AssetPreviewPublicationQueue.swift
      - path: Sources/Oia/Bridge/Mappers/SidebarCountModels.swift
      - path: Sources/Oia/Bridge/Mappers/HighlightRow.swift
      - path: Sources/Oia/Bridge/Mappers/SidebarItem+FFI.swift
      - path: Sources/Oia/Bridge/Mappers/ReadingSort+FFI.swift
      - path: Sources/Oia/Platform/Library/LibrarySetup.swift
      - path: Sources/Oia/Platform/Library/FolderWatcher.swift
      - path: Sources/Oia/Platform/Library/InboxFileAvailability.swift
      - path: Sources/Oia/Platform/Ingestion
      - path: Sources/Oia/Platform/NativeHost/NativeHostInstaller.swift
      - path: Sources/Oia/Platform/Spotlight
      - path: Sources/Oia/Platform/VisualAnalysis
      - path: Sources/Oia/Bridge/VisualSearchBridging.swift
      - path: Sources/Oia/Bridge/TextTaggingBridging.swift
      - path: Sources/Oia/Platform/ContentTagging
      - path: Sources/Oia/State/TextTaggingCoordinator.swift
      - path: Sources/Oia/State/VisualSearchCoordinator.swift
      - path: Sources/Oia/State/InteractionIdleGate.swift
      - path: GeneratedBindings
        optional: true   # populated by `make bindings`
    dependencies:
      - framework: Frameworks/OiaCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: CoreSpotlight.framework
      - sdk: ImageIO.framework
      - sdk: Vision.framework
      - package: LazyLayoutKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: is.edmundo.cuttings.tests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/GeneratedBindings
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/GeneratedBindings/oia_coreFFI.modulemap

  # XCUITest end-to-end suite. Drives the real app as a separate process, and is
  # dependency-free (only Xcode + the macOS SDK). The app stays on Swift 6; this
  # target uses 5.0 to avoid strict-concurrency friction in XCTest code.
  OiaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/OiaUITests
        excludes:
          - Checks/HighlightActionCheck.swift
          - Journeys/ComposedFiltersJourney.swift
          - Journeys/FindingArticleJourney.swift
          - Journeys/InboxZeroJourney.swift
          - Journeys/KeyboardPowerJourney.swift
          - Journeys/MorningCatchUpJourney.swift
          - Journeys/PersonalizationJourney.swift
          - Journeys/ReaderLayoutJourney.swift
          - Journeys/SearchFacetCountsJourney.swift
          - Journeys/SmartViewPinsFacetsJourney.swift
          - Journeys/StatePersistenceJourney.swift
          - Journeys/WeekendCleanupJourney.swift
          - PageObjects/SettingsPage.swift
          - PageObjects/ShortcutsSheetPage.swift
          - PageObjects/SidebarPage.swift
      # Shared with the app target (it also lives under Sources/Oia/) so
      # tests and app compile the same accessibility identifiers.
      - path: Sources/Oia/AccessibilityID.swift
    dependencies:
      - target: Oia
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: is.edmundo.cuttings.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Oia

# A shared scheme so `xcodebuild -scheme Oia` works from the command line
# and CI. Without this, xcodegen emits no scheme and only Xcode.app auto-creates
# a throwaway one under xcuserdata (not committed, wiped by `make clean`).
schemes:
  Oia:
    build:
      targets:
        Oia: all
    # Serial: UI tests steal keyboard focus, so parallel runs are flaky.
    # Per-test temp libraries keep future sharding open.
    test:
      config: Debug
      targets:
        # Unit tests first: they're fast and hostless, so a logic regression
        # fails the run before the slow UI suite even launches the app.
        - name: OiaTests
        - name: OiaUITests
          parallelizable: false
    run:
      config: Debug
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release
