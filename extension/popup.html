<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Óia</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        --text: #17181a;
        --surface: #fdfcfb;
        --hover: #eeedec;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f1f0ee;
          --surface: #0d0d0f;
          --hover: #242426;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 210px;
        margin: 0;
        padding: 6px;
        color: var(--text);
        background: var(--surface);
      }

      main {
        display: grid;
        gap: 2px;
      }

      button {
        min-height: 40px;
        width: 100%;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: transparent;
        font: inherit;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition-property: color, background-color;
        transition-duration: 100ms;
      }

      @media (hover: hover) {
        button:hover {
          background: var(--hover);
        }
      }

      button:focus-visible {
        outline: 2px solid currentcolor;
        outline-offset: -2px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      @media (forced-colors: active) {
        button:focus-visible {
          outline-color: Highlight;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Save to Óia">
      <button type="button" data-save-kind="page">Save</button>
      <button type="button" data-save-kind="screenshot">Save as screenshot</button>
    </main>

    <script src="dist/popup.js"></script>
  </body>
</html>
