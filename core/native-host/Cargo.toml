[package]
name = "oia-native-host"
description = "Native messaging host binary for the Óia browser extension."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "oia-native-host"
path = "src/main.rs"

[dependencies]
oia-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"

[dev-dependencies]
tempfile = "3"
