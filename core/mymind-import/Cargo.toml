[package]
name = "oia-import-mymind"
default-run = "oia-import-mymind"
description = "Migration adapter for mymind exports and Óia link metadata."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
oia-core = { path = "../core" }
reqwest = { version = "0.13", features = ["blocking", "brotli", "deflate", "gzip"] }
scraper = "0.27"
serde_json = "1"
sha2 = "0.10"
url = "2"
tempfile = "3"
